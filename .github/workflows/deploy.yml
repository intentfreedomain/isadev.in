name: Deploy Domain

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check secret is available
        run: |
          if [ -z "$INTDNS_API_KEY" ]; then
            echo "ERROR: INTDNS_API_KEY secret is not set or not accessible"
            exit 1
          else
            echo "OK: secret is set (length=${#INTDNS_API_KEY})"
          fi
        env:
          INTDNS_API_KEY: ${{ secrets.INTDNS_API_KEY }}

      - name: Register NS records
        env:
          INTDNS_API_KEY: ${{ secrets.INTDNS_API_KEY }}
        run: python scripts/deploy_domain.py
